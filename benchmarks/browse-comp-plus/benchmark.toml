[dataset]
queries_repo = "Tevatron/browsecomp-plus"
queries_revision = "144cff8e35b5eaef7e526346aa60774a9deb941f"
queries_split = "test"
expected_queries = 830
corpus_repo = "Tevatron/browsecomp-plus-corpus"
corpus_revision = "b27b02bc3e45511b8b82a13e6f90ce761df726f6"
corpus_split = "train"
expected_corpus_documents = 100195

[zvec_grep]
embedding = "local/potion-multilingual-128m"
embedding_concurrency = 4
max_filesize = "64M"
device = "cpu"
mcp_tool_timeout_seconds = 600
server_port = 7999

[run]
model = "custom-openai/qwen3.8-max"
reasoning_effort = "high"
trials_per_case = 1
infrastructure_retries = 0
idle_timeout_seconds = 1800
temperature = 0.0
seed = 42
max_output_tokens = 20000
context_limit = 1000000
