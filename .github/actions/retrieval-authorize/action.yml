name: Authorize Retrieval-only
description: Authorize local PR CI or maintainer manual/comment runs, including partial re-runs.
runs:
  using: composite
  steps:
    - uses: actions/github-script@v8
      env:
        DISPATCH_ACTOR: ${{ github.actor }}
        RERUN_ACTOR: ${{ github.triggering_actor }}
      with:
        script: |
          try {
            // Reusable workflows retain the caller's event and original actor.
            if (context.eventName === 'pull_request') {
              if (!context.payload?.pull_request ||
                  !['opened', 'synchronize', 'reopened'].includes(context.payload.action)) {
                throw new Error('Unsupported pull_request event for Retrieval-only.');
              }
              if (process.env.RETRIEVAL_EMBEDDING !== 'local') {
                throw new Error('Automatic PR retrieval requires local embedding.');
              }
              core.info('Authorized automatic PR retrieval with local embedding.');
              return;
            }
            const prComment = context.eventName === 'issue_comment' &&
              context.payload?.action === 'created' && context.payload?.issue?.pull_request;
            if (context.eventName !== 'workflow_dispatch' && !prComment) {
              throw new Error('Retrieval-only requires pull_request, workflow_dispatch or a PR comment caller.');
            }
            const actors = new Set([process.env.DISPATCH_ACTOR, process.env.RERUN_ACTOR]);
            for (const username of actors) {
              if (!username) throw new Error('Missing workflow actor.');
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              // GitHub maps maintain to permission=write; check the precise role.
              if (data.permission !== 'admin' && !['maintain', 'admin'].includes(data.role_name)) {
                throw new Error(`${username} requires the maintain or admin repository role.`);
              }
              core.info(`${username}: authorized (${data.role_name})`);
            }
          } catch (error) {
            await core.summary
              .addHeading('Retrieval-only: access denied')
              .addRaw('Automatic PR runs require local embedding. Manual and comment runs require maintainer or administrator permission. No results were produced by this job.')
              .write();
            throw error;
          }
