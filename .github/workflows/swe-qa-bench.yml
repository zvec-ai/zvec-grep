name: SWE-QA Bench

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Run the five-task smoke benchmark or the 20-task All-Full benchmark
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - all-full

permissions: {}

env:
  SWE_QA_TRIALS_PER_PROFILE: "3"

concurrency:
  group: swe-qa-bench-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate locked selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      task-matrix: ${{ steps.task-matrix.outputs.tasks }}
      task-count: ${{ steps.task-matrix.outputs.count }}
      task_ids_json: ${{ steps.task-matrix.outputs.task_ids_json }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked benchmark environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Validate tasks, hashes, commits, and reference isolation
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa validate
          --selection benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json
          --references benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json
          --dataset benchmarks/swe-qa-bench/datasets
      - name: Build this run's task matrix from the locked selection
        id: task-matrix
        env:
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'auto' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          selection = json.loads(
              Path(
                  "benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json"
              ).read_text(encoding="utf-8")
          )
          tasks = selection["tasks"]
          tasks_by_id = {task["task_id"]: task for task in tasks}
          scope = os.environ["SCOPE"]
          if scope in {"smoke", "auto"}:
              task_ids = selection["gate"]["auto_tasks"]
          elif scope in {"all-full", "gate-20"}:
              # gate-20 remains accepted for legacy API/CLI dispatches.
              task_ids = [task["task_id"] for task in tasks]
          else:
              raise SystemExit(f"unsupported SWE-QA scope: {scope}")
          if not task_ids:
              raise SystemExit(f"SWE-QA scope {scope} selected no tasks")
          if len(task_ids) != len(set(task_ids)):
              raise SystemExit(f"SWE-QA scope {scope} selected duplicate tasks")
          missing = sorted(set(task_ids) - tasks_by_id.keys())
          if missing:
              raise SystemExit(
                  f"SWE-QA scope {scope} selected unknown tasks: {missing}"
              )
          selected = [tasks_by_id[task_id] for task_id in task_ids]
          slugs = [task["task_slug"] for task in selected]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"tasks={json.dumps(slugs, separators=(',', ':'))}\n")
              output.write(f"count={len(slugs)}\n")
              output.write(
                  f"task_ids_json={json.dumps(task_ids, separators=(',', ':'))}\n"
              )
          PY
      - name: Run benchmark unit tests
        run: >-
          uv run --project benchmarks/swe-qa-bench python -m unittest discover
          -s benchmarks/swe-qa-bench/tests -v
      - name: Verify the Harbor command without credentials
        run: >-
          uv run --project benchmarks/swe-qa-bench zg-bench run
          swe-qa-bench
          --tier smoke
          --agent opencode
          --model custom-openai/glm-5.2
          --profile all
          --n-attempts "$SWE_QA_TRIALS_PER_PROFILE"
          --embedding-model local/potion-code-16m-v2
          --zvec-grep-package "$GITHUB_WORKSPACE"
          --job-name preflight
          --dry-run

  run-pair:
    name: Pair + judge / ${{ matrix.task }}
    needs: validate
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        task: ${{ fromJSON(needs.validate.outputs.task-matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Restore this task's zvec index seed
        id: zvec-index-seed-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/swe-qa-index-seed
          key: swe-qa-zvec-index-seed-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-bench-${{ hashFiles('benchmarks/swe-qa-bench/zg_bench/swe_qa/data/selection.json', 'benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json', format('benchmarks/swe-qa-bench/datasets/{0}/environment/Dockerfile', matrix.task)) }}-npm-${{ hashFiles('package-lock.json') }}-zvec-${{ hashFiles('src/**', 'package.json', 'tsconfig.json', 'eslint.config.js', 'README.md', 'README_CN.md', 'LICENSE', 'docs/**', '.opencode/opencode.json', 'benchmarks/swe-qa-bench/pyproject.toml', 'benchmarks/swe-qa-bench/uv.lock', 'benchmarks/swe-qa-bench/suites/swe-qa-bench.yaml', 'benchmarks/swe-qa-bench/zg_bench/agents/zvec_grep.py', 'benchmarks/swe-qa-bench/zg_bench/runner.py', 'benchmarks/swe-qa-bench/zg_bench/settings.py') }}
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
          npm ci
      - name: Run baseline and zvec-grep on the same runner
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
          ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/swe-qa-index-seed
        run: |
          set -euo pipefail
          if [[ -z "${GLM_API_KEY:-}" ]]; then
            echo "GLM_API_KEY Actions secret is not configured" >&2
            exit 2
          fi
          runs_dir="$RUNNER_TEMP/swe-qa-runs/$TASK_NAME"
          uv run --project benchmarks/swe-qa-bench zg-bench run \
            swe-qa-bench \
            --tier ci \
            --task "$TASK_NAME" \
            --agent opencode \
            --model custom-openai/glm-5.2 \
            --profile all \
            --n-attempts "$SWE_QA_TRIALS_PER_PROFILE" \
            --embedding-model local/potion-code-16m-v2 \
            --zvec-grep-package "$GITHUB_WORKSPACE" \
            --jobs-dir "$runs_dir" \
            --job-name "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TASK_NAME}"
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa collect \
            --runs-dir "$runs_dir" \
            --task "$TASK_NAME" \
            --expected-trials "$SWE_QA_TRIALS_PER_PROFILE" \
            --output "$RUNNER_TEMP/pair-${TASK_NAME}.json"
      - name: Judge this pair and write its independent report
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
        run: |
          set -euo pipefail
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa judge \
            --pairs-root "$RUNNER_TEMP/pair-${TASK_NAME}.json" \
            --references benchmarks/swe-qa-bench/zg_bench/swe_qa/data/references.json \
            --output-dir "$RUNNER_TEMP/swe-qa-task-report/${TASK_NAME}" \
            --expected "$TASK_NAME"
      - name: Reject secret leakage in artifacts
        id: secret-scan
        if: always()
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
          ZG_BENCH_INDEX_SEED_DIR: ${{ runner.temp }}/swe-qa-index-seed
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def contains_secret(path: Path, secret: bytes) -> bool:
              overlap = max(len(secret) - 1, 0)
              tail = b""
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      window = tail + chunk
                      if secret in window:
                          return True
                      tail = window[-overlap:] if overlap else b""
              return False

          secret = os.environ.get("GLM_API_KEY", "").encode()
          roots = [
              Path(os.environ["RUNNER_TEMP"]) / "swe-qa-runs" / os.environ["TASK_NAME"],
              Path(os.environ["RUNNER_TEMP"]) / f"pair-{os.environ['TASK_NAME']}.json",
              Path(os.environ["RUNNER_TEMP"]) / "swe-qa-task-report" / os.environ["TASK_NAME"],
              Path(os.environ["ZG_BENCH_INDEX_SEED_DIR"]),
          ]
          if secret:
              for root in roots:
                  files = [root] if root.is_file() else root.rglob("*") if root.exists() else []
                  for path in files:
                      if path.is_file() and contains_secret(path, secret):
                          raise SystemExit(f"secret material detected in artifact: {path}")
          PY
      - name: Upload paired Harbor evidence
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-pair-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pair-${{ matrix.task }}.json
            ${{ runner.temp }}/swe-qa-runs/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload independent task report
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-task-report-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-qa-task-report/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Save this task's populated zvec index seed
        if: success() && steps.zvec-index-seed-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/swe-qa-index-seed
          key: ${{ steps.zvec-index-seed-restore.outputs.cache-primary-key }}

  aggregate-report:
    name: Aggregate completed task reports
    needs: [validate, run-pair]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.run-pair.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked report environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/swe-qa-bench --frozen
      - name: Download this attempt's independent task reports
        uses: actions/download-artifact@v8
        with:
          pattern: swe-qa-task-report-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-reports
      - name: Detect report scope and show partial task reports
        id: report-set
        env:
          EXPECTED_COUNT: ${{ needs.validate.outputs.task-count }}
        run: |
          set -euo pipefail
          expected_count="$EXPECTED_COUNT"
          if [[ ! "$expected_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid expected report count: $expected_count"
            exit 1
          fi

          report_root="$RUNNER_TEMP/task-reports"
          mapfile -d '' -t json_reports < <(
            find "$report_root" -type f -name report.json -print0 | LC_ALL=C sort -z
          )
          actual_count="${#json_reports[@]}"
          if (( actual_count == 0 )); then
            echo "::error::No independent task reports were downloaded for this attempt."
            exit 1
          fi

          if [[ "$actual_count" == "$expected_count" ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -d '' -t markdown_reports < <(
            find "$report_root" -type f -name report.md -print0 | LC_ALL=C sort -z
          )
          if (( ${#markdown_reports[@]} != actual_count )); then
            echo "::error::Expected one report.md for each downloaded report.json."
            exit 1
          fi

          echo "complete=false" >> "$GITHUB_OUTPUT"
          {
            echo "## SWE-QA Aggregate"
            echo
            echo "**Partial rerun:** attempt ${GITHUB_RUN_ATTEMPT} contains ${actual_count} of ${expected_count} task reports. The cross-task Aggregate was intentionally skipped to avoid mixing workflow attempts, and no partial Aggregate artifact was generated."
            echo
            echo "The independent task report(s) produced by this attempt are shown below. Any Aggregate row inside an embedded report covers that task only."

            shown=0
            for report in "${markdown_reports[@]}"; do
              if (( shown > 0 )); then
                echo
                echo "---"
              fi
              shown=$((shown + 1))
              echo
              sed '1s/^# /### /' "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Combine reports without re-judging
        if: steps.report-set.outputs.complete == 'true'
        env:
          EXPECTED_TASKS_JSON: ${{ needs.validate.outputs.task_ids_json }}
        run: |
          set -euo pipefail
          mapfile -t expected_tasks < <(
            python -c 'import json, os; print(*json.loads(os.environ["EXPECTED_TASKS_JSON"]), sep="\n")'
          )
          if (( ${#expected_tasks[@]} == 0 )); then
            echo "::error::Locked selection produced no expected task IDs."
            exit 1
          fi
          uv run --project benchmarks/swe-qa-bench python -m zg_bench.swe_qa aggregate \
            --reports-root "$RUNNER_TEMP/task-reports" \
            --output-dir "$RUNNER_TEMP/swe-qa-aggregate-report" \
            --expected "${expected_tasks[@]}"
      - name: Upload aggregate report
        if: steps.report-set.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-aggregate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-qa-aggregate-report/
          if-no-files-found: warn
          retention-days: 90
