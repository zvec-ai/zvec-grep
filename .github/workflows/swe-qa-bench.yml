name: SWE-QA Bench (manual)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Run the smoke pair or all five gate pairs
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - gate-5

permissions: {}

concurrency:
  group: swe-qa-bench-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate locked selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked benchmark environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/coding --frozen
      - name: Validate tasks, hashes, commits, and reference isolation
        run: >-
          uv run --project benchmarks/coding python -m zg_bench.swe_qa validate
          --selection benchmarks/coding/zg_bench/swe_qa/data/selection.json
          --references benchmarks/coding/zg_bench/swe_qa/data/references.json
          --dataset benchmarks/coding/datasets/swe-qa-bench-manual
      - name: Run benchmark unit tests
        run: >-
          uv run --project benchmarks/coding python -m unittest discover
          -s benchmarks/coding/tests -v
      - name: Verify the Harbor command without credentials
        run: >-
          uv run --project benchmarks/coding zg-bench run
          swe-qa-bench-manual
          --tier smoke
          --task reflex-6
          --agent opencode
          --model custom-openai/glm-5.2
          --profile all
          --embedding-model local/potion-code-16m-v2
          --zvec-grep-package "$GITHUB_WORKSPACE"
          --job-name preflight
          --dry-run

  run-pair:
    name: Pair + judge / ${{ matrix.task }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJSON(inputs.scope == 'gate-5' && '["reflex-6","sqlfluff-2","sympy-38","streamlink-14","pylint-25"]' || '["reflex-6"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/coding --frozen
          npm ci
      - name: Run baseline and zvec-grep on the same runner
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
        run: |
          set -euo pipefail
          if [[ -z "${GLM_API_KEY:-}" ]]; then
            echo "GLM_API_KEY Actions secret is not configured" >&2
            exit 2
          fi
          runs_dir="$RUNNER_TEMP/swe-qa-runs/$TASK_NAME"
          uv run --project benchmarks/coding zg-bench run \
            swe-qa-bench-manual \
            --tier ci \
            --task "$TASK_NAME" \
            --agent opencode \
            --model custom-openai/glm-5.2 \
            --profile all \
            --embedding-model local/potion-code-16m-v2 \
            --zvec-grep-package "$GITHUB_WORKSPACE" \
            --jobs-dir "$runs_dir" \
            --job-name "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TASK_NAME}"
          uv run --project benchmarks/coding python -m zg_bench.swe_qa collect \
            --runs-dir "$runs_dir" \
            --task "$TASK_NAME" \
            --output "$RUNNER_TEMP/pair-${TASK_NAME}.json"
      - name: Judge this pair and write its independent report
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
        run: |
          set -euo pipefail
          uv run --project benchmarks/coding python -m zg_bench.swe_qa judge \
            --pairs-root "$RUNNER_TEMP/pair-${TASK_NAME}.json" \
            --references benchmarks/coding/zg_bench/swe_qa/data/references.json \
            --output-dir "$RUNNER_TEMP/swe-qa-task-report/${TASK_NAME}" \
            --expected "$TASK_NAME"
      - name: Reject secret leakage in artifacts
        id: secret-scan
        if: always()
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          secret = os.environ.get("GLM_API_KEY", "").encode()
          roots = [
              Path(os.environ["RUNNER_TEMP"]) / "swe-qa-runs" / os.environ["TASK_NAME"],
              Path(os.environ["RUNNER_TEMP"]) / f"pair-{os.environ['TASK_NAME']}.json",
              Path(os.environ["RUNNER_TEMP"]) / "swe-qa-task-report" / os.environ["TASK_NAME"],
          ]
          if secret:
              for root in roots:
                  files = [root] if root.is_file() else root.rglob("*") if root.exists() else []
                  for path in files:
                      if path.is_file() and secret in path.read_bytes():
                          raise SystemExit(f"secret material detected in artifact: {path}")
          PY
      - name: Upload paired Harbor evidence
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-pair-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pair-${{ matrix.task }}.json
            ${{ runner.temp }}/swe-qa-runs/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload independent task report
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-task-report-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-qa-task-report/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 90

  aggregate-report:
    name: Aggregate completed task reports
    needs: [validate, run-pair]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.run-pair.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked report environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/coding --frozen
      - name: Download this attempt's independent task reports
        uses: actions/download-artifact@v8
        with:
          pattern: swe-qa-task-report-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-reports
      - name: Detect report scope and show partial task reports
        id: report-set
        env:
          SCOPE: ${{ inputs.scope || 'smoke' }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE" == "gate-5" ]]; then
            expected_count=5
          else
            expected_count=1
          fi

          report_root="$RUNNER_TEMP/task-reports"
          mapfile -d '' -t json_reports < <(
            find "$report_root" -type f -name report.json -print0 | LC_ALL=C sort -z
          )
          actual_count="${#json_reports[@]}"
          if (( actual_count == 0 )); then
            echo "::error::No independent task reports were downloaded for this attempt."
            exit 1
          fi

          if [[ "$actual_count" == "$expected_count" ]]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -d '' -t markdown_reports < <(
            find "$report_root" -type f -name report.md -print0 | LC_ALL=C sort -z
          )
          if (( ${#markdown_reports[@]} != actual_count )); then
            echo "::error::Expected one report.md for each downloaded report.json."
            exit 1
          fi

          echo "complete=false" >> "$GITHUB_OUTPUT"
          {
            echo "## SWE-QA Aggregate"
            echo
            echo "**Partial rerun:** attempt ${GITHUB_RUN_ATTEMPT} contains ${actual_count} of ${expected_count} task reports. The cross-task Aggregate was intentionally skipped to avoid mixing workflow attempts, and no partial Aggregate artifact was generated."
            echo
            echo "The independent task report(s) produced by this attempt are shown below. Any Aggregate row inside an embedded report covers that task only."

            shown=0
            for report in "${markdown_reports[@]}"; do
              if (( shown > 0 )); then
                echo
                echo "---"
              fi
              shown=$((shown + 1))
              echo
              sed '1s/^# /### /' "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Combine reports without re-judging
        if: steps.report-set.outputs.complete == 'true'
        run: >-
          uv run --project benchmarks/coding python -m zg_bench.swe_qa aggregate
          --reports-root "$RUNNER_TEMP/task-reports"
          --output-dir "$RUNNER_TEMP/swe-qa-aggregate-report"
      - name: Upload aggregate report
        if: steps.report-set.outputs.complete == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-aggregate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-qa-aggregate-report/
          if-no-files-found: warn
          retention-days: 90
