name: SWE-QA Bench (manual)

on:
  # Temporary branch-only trigger used to validate this new workflow before it
  # exists on the default branch. Removed after the landing smoke passes.
  push:
    branches:
      - codex/swe-qa-bench-manual-ci
  workflow_dispatch:
    inputs:
      scope:
        description: Run the smoke pair or all five gate pairs
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - gate-5

permissions: {}

concurrency:
  group: swe-qa-bench-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate locked selection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked benchmark environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/coding --frozen
      - name: Validate tasks, hashes, commits, and reference isolation
        run: >-
          uv run --project benchmarks/coding python -m zg_bench.swe_qa validate
          --selection benchmarks/coding/zg_bench/swe_qa/data/selection.json
          --references benchmarks/coding/zg_bench/swe_qa/data/references.json
          --dataset benchmarks/coding/datasets/swe-qa-bench-manual
      - name: Run benchmark unit tests
        run: >-
          uv run --project benchmarks/coding python -m unittest discover
          -s benchmarks/coding/tests -v
      - name: Verify the Harbor command without credentials
        run: >-
          uv run --project benchmarks/coding zg-bench run
          swe-qa-bench-manual
          --tier smoke
          --task reflex-6
          --agent opencode
          --model custom-openai/glm-5.2
          --profile all
          --embedding-model local/potion-code-16m-v2
          --zvec-grep-package "$GITHUB_WORKSPACE"
          --job-name preflight
          --dry-run

  run-pair:
    name: Pair / ${{ matrix.task }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJSON((github.event_name == 'push' || inputs.scope == 'gate-5') && '["reflex-6","sqlfluff-2","sympy-38","streamlink-14","pylint-25"]' || '["reflex-6"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/coding --frozen
          npm ci
      - name: Run baseline and zvec-grep on the same runner
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
        run: |
          set -euo pipefail
          if [[ -z "${GLM_API_KEY:-}" ]]; then
            echo "GLM_API_KEY Actions secret is not configured" >&2
            exit 2
          fi
          runs_dir="$RUNNER_TEMP/swe-qa-runs/$TASK_NAME"
          uv run --project benchmarks/coding zg-bench run \
            swe-qa-bench-manual \
            --tier ci \
            --task "$TASK_NAME" \
            --agent opencode \
            --model custom-openai/glm-5.2 \
            --profile all \
            --embedding-model local/potion-code-16m-v2 \
            --zvec-grep-package "$GITHUB_WORKSPACE" \
            --jobs-dir "$runs_dir" \
            --job-name "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TASK_NAME}"
          uv run --project benchmarks/coding python -m zg_bench.swe_qa collect \
            --runs-dir "$runs_dir" \
            --task "$TASK_NAME" \
            --output "$RUNNER_TEMP/pair-${TASK_NAME}.json"
      - name: Reject secret leakage in artifacts
        id: secret-scan
        if: always()
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TASK_NAME: ${{ matrix.task }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          secret = os.environ.get("GLM_API_KEY", "").encode()
          roots = [
              Path(os.environ["RUNNER_TEMP"]) / "swe-qa-runs" / os.environ["TASK_NAME"],
              Path(os.environ["RUNNER_TEMP"]) / f"pair-{os.environ['TASK_NAME']}.json",
          ]
          if secret:
              for root in roots:
                  files = [root] if root.is_file() else root.rglob("*") if root.exists() else []
                  for path in files:
                      if path.is_file() and secret in path.read_bytes():
                          raise SystemExit(f"secret material detected in artifact: {path}")
          PY
      - name: Upload paired Harbor evidence
        if: always() && steps.secret-scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-pair-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pair-${{ matrix.task }}.json
            ${{ runner.temp }}/swe-qa-runs/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 30

  judge-report:
    name: GLM-5.2 self-judge and report
    needs: [validate, run-pair]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked judge environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/coding --frozen
      - name: Download all pair artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: swe-qa-pair-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pairs
          merge-multiple: true
      - name: Judge answers and write the five-metric summary
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          SCOPE: ${{ github.event_name == 'push' && 'gate-5' || inputs.scope || 'smoke' }}
        run: |
          set -euo pipefail
          if [[ -z "${GLM_API_KEY:-}" ]]; then
            echo "GLM_API_KEY Actions secret is not configured" >&2
            exit 2
          fi
          if [[ "$SCOPE" == "gate-5" ]]; then
            expected=(reflex-6 sqlfluff-2 sympy-38 streamlink-14 pylint-25)
          else
            expected=(reflex-6)
          fi
          expected_args=()
          for task in "${expected[@]}"; do
            expected_args+=(--expected "$task")
          done
          uv run --project benchmarks/coding python -m zg_bench.swe_qa judge \
            --pairs-root "$RUNNER_TEMP/pairs" \
            --references benchmarks/coding/zg_bench/swe_qa/data/references.json \
            --output-dir "$RUNNER_TEMP/swe-qa-report" \
            "${expected_args[@]}"
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swe-qa-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/swe-qa-report/
          if-no-files-found: warn
          retention-days: 90
