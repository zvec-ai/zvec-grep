name: BrowseComp-Plus Retrieval-only
run-name: BrowseComp-Plus Retrieval-only / Node 0.2.2 vs Rust ${{ inputs.candidate_ref }}

on:
  workflow_call:
    inputs:
      pr_number:
        default: "308"
        type: string
      baseline_ref:
        default: npm:@zvec/zvec-grep@0.2.2
        type: string
      baseline_repository:
        default: zvec-ai/zvec-grep
        type: string
      candidate_ref:
        required: true
        type: string
      candidate_repository:
        default: zvec-ai/zvec-grep
        type: string
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR associated with this independent full-corpus run
        default: "308"
        type: string
      candidate_ref:
        description: Rust source ref in zvec-ai/zvec-grep (resolved to an immutable SHA)
        default: main
        required: true
        type: string

permissions:
  contents: read

env:
  RETRIEVAL_EMBEDDING: local

concurrency:
  group: browsecomp-plus-retrieval-dedicated
  cancel-in-progress: false

jobs:
  package:
    name: Validate harness and freeze both packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      harness: ${{ steps.identity.outputs.harness }}
      rust: ${{ steps.rust.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - name: Require an explicit manual full-corpus run
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo '::error::Full BrowseComp retrieval requires workflow_dispatch; ordinary PR updates run only offline contracts and standard retrieval.'
          exit 1
      - name: Require the dedicated long-running host to be provisioned
        env:
          RUNNER_READY: ${{ vars.BROWSECOMP_RUNNER_READY }}
        run: |
          if [ "$RUNNER_READY" != 'true' ]; then
            echo '::error::Provision ONE Linux x64 self-hosted runner labelled browsecomp-plus, then set BROWSECOMP_RUNNER_READY=true. The full corpus cannot fit the hosted 6-hour job budget. No full run has started.'
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Freeze identities and require the official Node.js baseline
        id: identity
        env:
          BASELINE: ${{ inputs.baseline_ref || 'npm:@zvec/zvec-grep@0.2.2' }}
          BASELINE_REPOSITORY: ${{ inputs.baseline_repository || 'zvec-ai/zvec-grep' }}
        run: |
          test "$BASELINE" = 'npm:@zvec/zvec-grep@0.2.2'
          test "$BASELINE_REPOSITORY" = 'zvec-ai/zvec-grep'
          echo "harness=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Parquet reader
        run: python -m pip install --requirement benchmarks/browse-comp-plus-retrieval/requirements.txt
      - name: Test retrieval contracts and frozen BrowseComp inputs
        run: |
          node --test benchmarks/zg-retrieval/test/*.test.mjs benchmarks/browse-comp-plus-retrieval/test/*.test.mjs
          python -m unittest discover -s benchmarks/browse-comp-plus-retrieval/test -p 'test_*.py' -v
      - name: Download and verify unchanged Node.js 0.2.2
        run: |
          node benchmarks/shared/retrieval-package.mjs download-node \
            --output "$RUNNER_TEMP/packages/node"
          node benchmarks/shared/retrieval-package.mjs verify \
            --directory "$RUNNER_TEMP/packages/node" --commit 'npm:@zvec/zvec-grep@0.2.2'
      - name: Build the frozen Rust candidate
        id: rust
        uses: ./.github/actions/rust-candidate-package
        with:
          candidate_repository: ${{ inputs.candidate_repository || 'zvec-ai/zvec-grep' }}
          candidate_ref: ${{ inputs.candidate_ref }}
          cache_namespace: browsecomp-retrieval-rust
      - name: Stage the commit-verified Rust package
        run: |
          mkdir -p "$RUNNER_TEMP/packages/rust"
          cp -a "$RUNNER_TEMP/rust-package-cache/." "$RUNNER_TEMP/packages/rust/"
      - uses: actions/upload-artifact@v7
        with:
          name: browsecomp-plus-retrieval-packages
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          retention-days: 14

  node:
    name: Node fresh full Index and 150 Query calls on dedicated host
    needs: package
    runs-on:
      [
        self-hosted,
        linux,
        x64,
        "${{ vars.BROWSECOMP_RUNNER_LABEL || 'browsecomp-plus' }}",
      ]
    timeout-minutes: 840
    outputs:
      prepared: ${{ steps.prepare.outcome }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.package.outputs.harness }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - name: Locate the same-host run directory (never a reusable index cache)
        run: |
          echo "BCP_ROOT=$RUNNER_TOOL_CACHE/browsecomp-plus/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "BCP_MODEL_CACHE=$RUNNER_TOOL_CACHE/browsecomp-plus/model-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require a new run directory and enough dedicated disk
        run: |
          test ! -e "$BCP_ROOT"
          mkdir -p "$BCP_ROOT"
          python -c 'import os, shutil; free = shutil.disk_usage(os.environ["BCP_ROOT"]).free; print(f"Free disk: {free / 2**30:.1f} GiB"); assert free >= 50 * 2**30, "BrowseComp+ needs 50 GiB free disk"'
      - uses: actions/download-artifact@v8
        with:
          name: browsecomp-plus-retrieval-packages
          path: ${{ env.BCP_ROOT }}/packages
      - name: Install the pinned dataset reader (pip download cache is reusable)
        run: python -m pip install --requirement benchmarks/browse-comp-plus-retrieval/requirements.txt
      - name: Prepare complete corpus from checksum-verified read-only source cache
        run: |
          python benchmarks/browse-comp-plus-retrieval/prepare.py \
            --source "${{ runner.tool_cache }}/browsecomp-plus/source" \
            --output "$BCP_ROOT/prepared"
      - name: Verify packages, freeze inputs, install once and warm both models
        id: prepare
        env:
          RUST_COMMIT: ${{ needs.package.outputs.rust }}
          HARNESS_COMMIT: ${{ needs.package.outputs.harness }}
          PR_NUMBER: ${{ inputs.pr_number || '308' }}
        run: |
          node benchmarks/browse-comp-plus-retrieval/run.mjs --phase prepare \
            --dataset "$BCP_ROOT/prepared" --output "$BCP_ROOT/results" \
            --node-package "$BCP_ROOT/packages/node/candidate.tgz" \
            --rust-package "$BCP_ROOT/packages/rust/candidate.tgz" \
            --rust-commit "$RUST_COMMIT" --harness-commit "$HARNESS_COMMIT" \
            --pr-number "$PR_NUMBER" --model-cache "$BCP_MODEL_CACHE"
      - name: Node Index (100,195 fresh documents; 12-hour internal budget)
        id: index
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node benchmarks/browse-comp-plus-retrieval/run.mjs --output "$BCP_ROOT/results" --phase node-index
      - name: Publish the latest Node Index stage report even after failure
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$BCP_ROOT/results/summary.md" ]; then
            cat "$BCP_ROOT/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# BrowseComp-Plus: incomplete before measurements (never a passing comparison)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save node index checkpoint before continuing
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browsecomp-plus-retrieval-node-index
          path: |
            ${{ env.BCP_ROOT }}/results/
            ${{ env.BCP_ROOT }}/prepared/dataset.json
            ${{ env.BCP_ROOT }}/prepared/corpus-manifest.jsonl
            !${{ env.BCP_ROOT }}/results/**/consumer/**
            !${{ env.BCP_ROOT }}/results/**/runtime-home/**
            !${{ env.BCP_ROOT }}/results/warmup/**
            !${{ env.BCP_ROOT }}/results/warmup-home/**
          if-no-files-found: warn
          retention-days: 30
      - name: Node Query (hybrid, fts, vector; 50 calls each)
        id: query
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        run: node benchmarks/browse-comp-plus-retrieval/run.mjs --output "$BCP_ROOT/results" --phase node-query
      - name: Stop node and release only this run's generated index
        if: ${{ always() && steps.access.outcome == 'success' && steps.prepare.outcome == 'success' }}
        run: node benchmarks/browse-comp-plus-retrieval/run.mjs --output "$BCP_ROOT/results" --phase release-node
      - name: Publish the latest Node Query stage report even after failure
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$BCP_ROOT/results/summary.md" ]; then
            cat "$BCP_ROOT/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# BrowseComp-Plus: incomplete before measurements (never a passing comparison)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save node query checkpoint before continuing
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browsecomp-plus-retrieval-node-query
          path: |
            ${{ env.BCP_ROOT }}/results/
            ${{ env.BCP_ROOT }}/prepared/dataset.json
            ${{ env.BCP_ROOT }}/prepared/corpus-manifest.jsonl
            !${{ env.BCP_ROOT }}/results/**/consumer/**
            !${{ env.BCP_ROOT }}/results/**/runtime-home/**
            !${{ env.BCP_ROOT }}/results/warmup/**
            !${{ env.BCP_ROOT }}/results/warmup-home/**
          if-no-files-found: warn
          retention-days: 30

  rust:
    name: Rust fresh full Index and 150 Query calls on dedicated host
    needs: [package, node]
    if: ${{ always() && !cancelled() && needs.package.result == 'success' && needs.node.outputs.prepared == 'success' }}
    runs-on:
      [
        self-hosted,
        linux,
        x64,
        "${{ vars.BROWSECOMP_RUNNER_LABEL || 'browsecomp-plus' }}",
      ]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.package.outputs.harness }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - name: Locate the same-host run directory (never a reusable index cache)
        run: |
          echo "BCP_ROOT=$RUNNER_TOOL_CACHE/browsecomp-plus/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "BCP_MODEL_CACHE=$RUNNER_TOOL_CACHE/browsecomp-plus/model-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require the same host and this run's durable completed preparation
        id: resume
        run: |
          test -f "$BCP_ROOT/results/state.json" || { echo '::error::Missing same-host state. The browsecomp-plus label must select ONE dedicated host.'; exit 1; }
          test -f "$BCP_ROOT/results/summary.json"
      - name: Rust Index (100,195 fresh documents; 3-hour internal budget)
        id: index
        if: ${{ !cancelled() && steps.resume.outcome == 'success' }}
        run: node benchmarks/browse-comp-plus-retrieval/run.mjs --output "$BCP_ROOT/results" --phase rust-index
      - name: Publish the latest Rust Index stage report even after failure
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$BCP_ROOT/results/summary.md" ]; then
            cat "$BCP_ROOT/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# BrowseComp-Plus: incomplete before measurements (never a passing comparison)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save rust index checkpoint before continuing
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browsecomp-plus-retrieval-rust-index
          path: |
            ${{ env.BCP_ROOT }}/results/
            ${{ env.BCP_ROOT }}/prepared/dataset.json
            ${{ env.BCP_ROOT }}/prepared/corpus-manifest.jsonl
            !${{ env.BCP_ROOT }}/results/**/consumer/**
            !${{ env.BCP_ROOT }}/results/**/runtime-home/**
            !${{ env.BCP_ROOT }}/results/warmup/**
            !${{ env.BCP_ROOT }}/results/warmup-home/**
          if-no-files-found: warn
          retention-days: 30
      - name: Rust Query (hybrid, fts, vector; 50 calls each)
        id: query
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        run: node benchmarks/browse-comp-plus-retrieval/run.mjs --output "$BCP_ROOT/results" --phase rust-query
      - name: Stop rust and release only this run's generated index
        if: ${{ always() && steps.access.outcome == 'success' && steps.resume.outcome == 'success' }}
        run: node benchmarks/browse-comp-plus-retrieval/run.mjs --output "$BCP_ROOT/results" --phase release-rust
      - name: Audit all 300 calls and accept only both complete fresh indexes
        if: ${{ always() && steps.access.outcome == 'success' && steps.resume.outcome == 'success' }}
        run: node benchmarks/browse-comp-plus-retrieval/run.mjs --output "$BCP_ROOT/results" --phase finish
      - name: Publish the latest complete comparison stage report even after failure
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$BCP_ROOT/results/summary.md" ]; then
            cat "$BCP_ROOT/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# BrowseComp-Plus: incomplete before measurements (never a passing comparison)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save rust query checkpoint before continuing
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browsecomp-plus-retrieval-rust-query
          path: |
            ${{ env.BCP_ROOT }}/results/
            ${{ env.BCP_ROOT }}/prepared/dataset.json
            ${{ env.BCP_ROOT }}/prepared/corpus-manifest.jsonl
            !${{ env.BCP_ROOT }}/results/**/consumer/**
            !${{ env.BCP_ROOT }}/results/**/runtime-home/**
            !${{ env.BCP_ROOT }}/results/warmup/**
            !${{ env.BCP_ROOT }}/results/warmup-home/**
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve the final compact comparison
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browsecomp-plus-retrieval-report
          path: |
            ${{ env.BCP_ROOT }}/results/summary.json
            ${{ env.BCP_ROOT }}/results/summary.md
          if-no-files-found: warn
          retention-days: 90
