name: BrowseComp-Plus
run-name: BrowseComp-Plus / ${{ inputs.candidate_ref }} / ${{ inputs.suite }}

on:
  workflow_call:
    inputs:
      candidate_ref:
        required: true
        type: string
      suite:
        default: ci
        type: string
      parallel_cases:
        default: "5"
        type: string
      prepared_run_id:
        default: ""
        type: string
    secrets:
      QWEN_API_KEY:
        required: false
      GLM_API_KEY:
        required: false
      HF_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Trusted Rust source branch, tag, or commit in this repository
        required: true
        default: main
        type: string
      suite:
        description: Paired suite (complete corpus; repetitions configured in benchmark.toml)
        required: true
        default: ci
        type: choice
        options: [ci, smoke]
      parallel_cases:
        description: Maximum concurrent case runners (lower this for provider rate limits)
        default: "5"
        type: choice
        options: ["1", "2", "5"]
      prepared_run_id:
        description: Optional prior run with the exact same preparation; invalid snapshots fail without rebuilding
        type: string

permissions: {}

# Keep separately requested runs and re-runs independent, as in SWE-QA Bench.
concurrency:
  group: browse-comp-plus-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate harness and build candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - &authorize
        name: Authorize manual benchmark
        id: authorize
        uses: actions/github-script@v8
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          RERUN_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch') {
              throw new Error('BrowseComp-Plus requires a manual workflow dispatch.');
            }
            for (const username of new Set([process.env.DISPATCH_ACTOR, process.env.RERUN_ACTOR])) {
              if (!username) throw new Error('Missing workflow actor.');
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              if (!['maintain', 'admin'].includes(data.role_name)) {
                throw new Error('BrowseComp-Plus requires the maintain or admin repository role.');
              }
            }
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install locked benchmark environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/browse-comp-plus --frozen
          npm install --global opencode-ai@1.18.4
      - name: Run offline CI integration tests
        env:
          OPENCODE_BENCHMARK_TEST_BINARY: opencode
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m unittest discover
          -s benchmarks/browse-comp-plus/tests -v
      - name: Build the selected Rust candidate without model credentials
        id: candidate
        uses: ./.github/actions/rust-candidate-package
        with:
          candidate_repository: ${{ github.repository }}
          candidate_ref: ${{ inputs.candidate_ref }}
          cache_namespace: browse-comp-plus-rust
      - uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/rust-package-cache/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  prepare:
    name: Prepare or restore corpus and index once
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
      snapshot-key: ${{ steps.snapshot-key.outputs.key }}
      snapshot-artifact: ${{ steps.snapshot-reference.outputs.name }}
      snapshot-run-id: ${{ steps.snapshot-reference.outputs.run-id }}
    env: &benchmark-env
      NO_COLOR: "1"
      BROWSE_CANDIDATE_COMMIT: ${{ needs.package.outputs.commit }}
      BROWSE_HARNESS_COMMIT: ${{ github.workflow_sha }}
      BROWSE_COMP_MODEL_BASE_URL: ${{ vars.BROWSE_COMP_MODEL_BASE_URL || vars.SWE_QA_MODEL_BASE_URL }}
    steps:
      - *authorize
      - &checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - &python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - &node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - &tools
        name: Install pinned benchmark tools
        run: |
          echo "OPENCODE_HOME=$RUNNER_TEMP/browse-comp-plus-opencode" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/browse-comp-plus --frozen
          npm install --global opencode-ai@1.18.4
          if ! command -v zstd >/dev/null || ! command -v rg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd ripgrep
          fi
      - &candidate-download
        name: Download the candidate from this run
        uses: actions/download-artifact@v8
        with:
          name: browse-comp-plus-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-package
      - &candidate-install
        name: Verify and install the exact candidate
        run: |
          node benchmarks/shared/rust-package-cache.mjs verify \
            --directory "$RUNNER_TEMP/candidate-package" --commit "$BROWSE_CANDIDATE_COMMIT"
          npm install --global "$RUNNER_TEMP/candidate-package/candidate.tgz"
      - &space
        name: Reserve space for corpus, index, and compressed snapshot
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          python -c 'import shutil; free = shutil.disk_usage(".").free; print(f"Free disk: {free / 2**30:.1f} GiB"); assert free >= 50 * 2**30, "BrowseComp-Plus needs at least 50 GiB free disk"'
      - &credentials
        name: Configure isolated credentials and verify tools
        id: setup
        env:
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
        run: |
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci auth
          uv run --project benchmarks/browse-comp-plus --frozen zg-bench doctor
      - name: Verify configured model access before indexing
        env: &model-env
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
        run: uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci preflight
      - name: Compute exact preparation identity
        id: snapshot-key
        run: uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_snapshot key >> "$GITHUB_OUTPUT"
      - name: Find a verified preparation from an earlier manual run
        id: prepared-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_KEY: ${{ steps.snapshot-key.outputs.key }}
          LEGACY_SNAPSHOT_KEY: ${{ steps.snapshot-key.outputs.legacy_key }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_prepared_artifact discover
          --key "$RUNNER_OS-$RUNNER_ARCH-$SNAPSHOT_KEY" --source-run-id "$PREPARED_RUN_ID"
          --legacy-key "$RUNNER_OS-$RUNNER_ARCH-$LEGACY_SNAPSHOT_KEY"
      - name: Download a compatible full preparation for one-time conversion
        if: steps.prepared-artifact.outputs.found == 'true' && steps.prepared-artifact.outputs.legacy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.prepared-artifact.outputs.artifact-name }}
          run-id: ${{ steps.prepared-artifact.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/browse-comp-plus-snapshot
      - name: Restore prepared files with exact timestamps
        if: steps.prepared-artifact.outputs.found == 'true' && steps.prepared-artifact.outputs.legacy == 'true'
        env:
          SNAPSHOT_KEY: ${{ steps.snapshot-key.outputs.legacy_key }}
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_snapshot unpack
          --archive "$RUNNER_TEMP/browse-comp-plus-snapshot/prepared.tar.zst" --key "$SNAPSHOT_KEY"
      - name: Download only the small query source on an exact preparation match
        if: steps.prepared-artifact.outputs.found == 'true' && steps.prepared-artifact.outputs.legacy == 'false'
        uses: actions/download-artifact@v8
        with:
          name: browse-comp-plus-plan-${{ steps.prepared-artifact.outputs.run-id }}
          run-id: ${{ steps.prepared-artifact.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/browse-comp-plus-source-plan
      - name: Verify the query source before making a fresh evaluation plan
        if: steps.prepared-artifact.outputs.found == 'true' && steps.prepared-artifact.outputs.legacy == 'false'
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_parallel restore-queries
          --plan "$RUNNER_TEMP/browse-comp-plus-source-plan/plan.json"
      - name: Restore pinned source snapshots on a cold preparation
        if: steps.prepared-artifact.outputs.found != 'true'
        id: source-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            benchmarks/browse-comp-plus/artifacts/source
            benchmarks/browse-comp-plus/artifacts/state/dataset.json
          key: browse-comp-plus-source-v1-${{ runner.os }}-${{ hashFiles('benchmarks/browse-comp-plus/benchmark.toml', 'benchmarks/browse-comp-plus/zg_bench/dataset.py', 'benchmarks/browse-comp-plus/uv.lock') }}
      - name: Validate a restored snapshot without rebuilding it
        if: steps.prepared-artifact.outputs.found == 'true' && steps.prepared-artifact.outputs.legacy == 'true'
        run: uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_snapshot verify
      - name: Download and verify pinned source snapshots before indexing
        if: steps.prepared-artifact.outputs.found != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci fetch
      - name: Save verified source snapshots
        if: steps.prepared-artifact.outputs.found != 'true' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            benchmarks/browse-comp-plus/artifacts/source
            benchmarks/browse-comp-plus/artifacts/state/dataset.json
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - name: Build the corpus and index once on a miss
        if: steps.prepared-artifact.outputs.found != 'true'
        id: prepare
        run: uv run --project benchmarks/browse-comp-plus --frozen zg-bench prepare --yes
      - name: Pack a credential-scanned runtime snapshot with one corpus copy
        if: steps.prepared-artifact.outputs.found != 'true' || steps.prepared-artifact.outputs.legacy == 'true'
        env:
          SNAPSHOT_KEY: ${{ steps.snapshot-key.outputs.key }}
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # A verified full archive is no longer needed; reclaim disk before conversion.
          rm -f -- "$RUNNER_TEMP/browse-comp-plus-snapshot/prepared.tar.zst"
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_snapshot pack \
            --archive "$RUNNER_TEMP/browse-comp-plus-snapshot/prepared.tar.zst" --key "$SNAPSHOT_KEY"
      # Runtime artifacts omit Parquet and the duplicate baseline corpus.
      # Keep preparation snapshots separate from the source/candidate cache quota.
      - name: Publish a reusable preparation artifact
        if: steps.prepared-artifact.outputs.found != 'true' || steps.prepared-artifact.outputs.legacy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-prepared-${{ runner.os }}-${{ runner.arch }}-${{ steps.snapshot-key.outputs.key }}
          path: ${{ runner.temp }}/browse-comp-plus-snapshot/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Share the preparation artifact reference with case jobs
        id: snapshot-reference
        env:
          FOUND: ${{ steps.prepared-artifact.outputs.found }}
          LEGACY: ${{ steps.prepared-artifact.outputs.legacy }}
          SOURCE_RUN: ${{ steps.prepared-artifact.outputs.run-id }}
          SOURCE_NAME: ${{ steps.prepared-artifact.outputs.artifact-name }}
          SNAPSHOT_KEY: ${{ steps.snapshot-key.outputs.key }}
        run: |
          if [[ "$FOUND" == true && "$LEGACY" == false ]]; then
            printf 'run-id=%s\nname=%s\n' "$SOURCE_RUN" "$SOURCE_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'run-id=%s\nname=browse-comp-plus-prepared-%s-%s-%s\n' "$GITHUB_RUN_ID" "$RUNNER_OS" "$RUNNER_ARCH" "$SNAPSHOT_KEY" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan the suite and balanced A/B orders once
        id: plan
        env:
          BENCH_SUITE: ${{ inputs.suite }}
        run: |
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_parallel plan \
            --suite "$BENCH_SUITE" --output "$RUNNER_TEMP/browse-comp-plus-plan" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/candidate-package/manifest.json" "$RUNNER_TEMP/browse-comp-plus-plan/candidate-manifest.json"
      - name: Publish the small evaluation plan and query set
        uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/browse-comp-plus-plan/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Export preparation diagnostics on failure
        id: diagnostics
        if: ${{ (failure() || cancelled()) && steps.setup.outcome == 'success' }}
        env: &scan-env
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci export
          --output "$RUNNER_TEMP/preparation-diagnostics"
          --candidate-manifest "$RUNNER_TEMP/candidate-package/manifest.json"
      - name: Upload preparation diagnostics
        if: ${{ always() && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-preparation-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preparation-diagnostics/
          retention-days: 7
      - &cleanup
        name: Remove temporary authentication
        if: always()
        run: |
          if [[ -n "${OPENCODE_HOME:-}" ]]; then
            rm -rf -- "$OPENCODE_HOME"
          fi

  case:
    name: Pair + judge / ${{ matrix.case }}
    needs: [package, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel_cases) }}
      matrix:
        case: ${{ fromJSON(needs.prepare.outputs.cases) }}
    env:
      NO_COLOR: "1"
      BROWSE_CANDIDATE_COMMIT: ${{ needs.package.outputs.commit }}
      BROWSE_HARNESS_COMMIT: ${{ github.workflow_sha }}
      BROWSE_COMP_MODEL_BASE_URL: ${{ vars.BROWSE_COMP_MODEL_BASE_URL || vars.SWE_QA_MODEL_BASE_URL }}
      BROWSE_CASE: ${{ matrix.case }}
    steps:
      - *authorize
      - *checkout
      - *python
      - *node
      - *tools
      - *candidate-download
      - *candidate-install
      - *space
      - *credentials
      - name: Download the shared prepared snapshot
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.snapshot-artifact }}
          run-id: ${{ needs.prepare.outputs.snapshot-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/browse-comp-plus-snapshot
      - &plan-download
        name: Download the immutable suite plan
        uses: actions/download-artifact@v8
        with:
          name: browse-comp-plus-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/browse-comp-plus-plan
      - name: Restore prepared files without rebuilding the index
        id: restore
        env:
          SNAPSHOT_KEY: ${{ needs.prepare.outputs.snapshot-key }}
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_snapshot unpack
          --archive "$RUNNER_TEMP/browse-comp-plus-snapshot/prepared.tar.zst" --key "$SNAPSHOT_KEY"
      - name: Find earlier evidence for this case in the same workflow run
        if: github.run_attempt > 1
        id: previous-evidence
        uses: actions/github-script@v8
        with:
          script: |
            const prefix = `browse-comp-plus-case-${process.env.BROWSE_CASE}-${context.runId}-`;
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: context.runId, per_page: 100,
            });
            const prior = artifacts.filter(artifact => {
              if (artifact.expired || !artifact.name.startsWith(prefix)) return false;
              const suffix = artifact.name.slice(prefix.length);
              return /^[1-9][0-9]*$/.test(suffix) && Number(suffix) < attempt;
            });
            core.setOutput('found', prior.length > 0 ? 'true' : 'false');
      - name: Download earlier case evidence to reuse completed trials
        if: steps.previous-evidence.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: browse-comp-plus-case-${{ matrix.case }}-${{ github.run_id }}-*
          path: ${{ runner.temp }}/browse-comp-plus-previous
      - name: Run this case's paired trials in the planned order
        id: run
        env:
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY || secrets.GLM_API_KEY }}
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_parallel run
          --plan "$RUNNER_TEMP/browse-comp-plus-plan/plan.json" --case "$BROWSE_CASE"
          --previous-evidence "$RUNNER_TEMP/browse-comp-plus-previous"
      - name: Judge completed pairs
        if: ${{ !cancelled() && steps.run.outcome != 'skipped' && steps.restore.outcome == 'success' }}
        env: *model-env
        run: uv run --project benchmarks/browse-comp-plus --frozen zg-bench evaluate
      - name: Summarize trial retries
        if: ${{ always() && steps.setup.outcome == 'success' }}
        run: uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_reports retries
      - name: Stage reports and reject credential leakage
        id: evidence
        if: ${{ always() && steps.setup.outcome == 'success' }}
        env: *scan-env
        run: |
          plan_args=()
          if [[ -f "$RUNNER_TEMP/browse-comp-plus-plan/plan.json" ]]; then
            plan_args+=(--plan "$RUNNER_TEMP/browse-comp-plus-plan/plan.json")
          fi
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci export \
            --output "$RUNNER_TEMP/browse-comp-plus-evidence" \
            --candidate-manifest "$RUNNER_TEMP/candidate-package/manifest.json" \
            "${plan_args[@]}"
      - name: Upload independent case evidence
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-case-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browse-comp-plus-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Stage the small case report
        id: report
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_reports compact
          --evidence "$RUNNER_TEMP/browse-comp-plus-evidence" --output "$RUNNER_TEMP/browse-comp-plus-report"
      - name: Upload independent case report
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-task-report-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browse-comp-plus-report/
          if-no-files-found: error
          retention-days: 90
      - *cleanup

  aggregate:
    name: Aggregate raw trials without more model calls
    needs: [package, prepare, case]
    if: ${{ always() && needs.prepare.result == 'success' && needs.case.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env: *benchmark-env
    steps:
      - *authorize
      - *checkout
      - *python
      - name: Install locked reporting environment
        run: |
          echo "OPENCODE_HOME=$RUNNER_TEMP/browse-comp-plus-opencode" >> "$GITHUB_ENV"
          python -m pip install --disable-pip-version-check uv==0.9.17
          uv sync --project benchmarks/browse-comp-plus --frozen
      - *plan-download
      - name: Download case evidence including earlier successful attempts
        uses: actions/download-artifact@v8
        with:
          pattern: browse-comp-plus-case-*-${{ github.run_id }}-*
          path: ${{ runner.temp }}/browse-comp-plus-shards
      - name: Recompute aggregate metrics and require every planned pair and judgement
        id: aggregate
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_parallel aggregate
          --plan "$RUNNER_TEMP/browse-comp-plus-plan/plan.json" --shards "$RUNNER_TEMP/browse-comp-plus-shards"
      - name: Stage the aggregate report
        id: evidence
        if: ${{ always() && steps.aggregate.outcome != 'skipped' && steps.authorize.outcome == 'success' }}
        env: *scan-env
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci export
          --output "$RUNNER_TEMP/browse-comp-plus-aggregate"
          --candidate-manifest "$RUNNER_TEMP/browse-comp-plus-plan/candidate-manifest.json"
          --plan "$RUNNER_TEMP/browse-comp-plus-plan/plan.json"
      - name: Upload the aggregate report
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browse-comp-plus-aggregate/
          if-no-files-found: error
          retention-days: 30
      - name: Stage the small aggregate report
        id: report
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        run: >-
          uv run --project benchmarks/browse-comp-plus --frozen python -m zg_bench.ci_reports compact
          --evidence "$RUNNER_TEMP/browse-comp-plus-aggregate" --output "$RUNNER_TEMP/browse-comp-plus-report"
      - name: Upload the small aggregate report
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: browse-comp-plus-aggregate-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browse-comp-plus-report/
          if-no-files-found: error
          retention-days: 90
