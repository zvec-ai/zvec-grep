name: Publish Rust packages

on:
  push:
    branches: [main, "release/rust-*"]
    paths:
      - "rust/**"
      - ".github/workflows/rust-publish.yml"
      - ".github/workflows/rust-package-build.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified packages to npm instead of only uploading artifacts.
        type: boolean
        default: false
      dist_tag:
        description: Promote to latest only after registry install/update/rollback checks pass.
        type: choice
        options: [rust-canary, latest]
        default: rust-canary

permissions: {}

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  source:
    name: Validate release source
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate the manifest and release ref
        id: version
        working-directory: rust
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          rustup show active-toolchain
          npm run release:verify
          version="$(cargo metadata --locked --no-deps --format-version 1 | node -e 'let s=""; process.stdin.on("data", d => s+=d).on("end", () => console.log(JSON.parse(s).packages.find(p => p.name === "zg").version))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" == "true" ]]; then
            if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
              echo "::error::npm publishing must run from main"
              exit 1
            fi
            tag_commit="$(git rev-parse --verify "refs/tags/rust-v$version^{commit}")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::rust-v$version must point to the commit being published"
              exit 1
            fi
            node scripts/npm-release.mjs verify-publication
          fi
      - name: Test package selection and installation
        working-directory: rust
        run: node --test scripts/npm-*.test.mjs npm/meta/install.test.cjs

  intel:
    name: Verify Intel macOS first
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/rust-package-build.yml
    with:
      target: darwin-x64
      runner: macos-15-intel

  build:
    name: Build ${{ matrix.target }}
    needs: [source, intel]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: win32-x64-msvc
            runner: windows-2022
    uses: ./.github/workflows/rust-package-build.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  collect:
    name: Collect downloadable release packages
    needs: [source, intel, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: rust-native-*
          merge-multiple: true
          path: rust/dist/npm/release/tarballs
      - name: Pack the exact-version meta package and verify the complete release
        run: |
          rustup show active-toolchain
          npm run release:collect
      - name: Upload all packages and download instructions
        uses: actions/upload-artifact@v7
        with:
          name: rust-release-${{ needs.source.outputs.version }}
          path: rust/dist/npm/release/tarballs/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified candidates to rust-canary
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [source, collect]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    outputs:
      baseline: ${{ steps.baseline.outputs.baseline }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with OIDC dist-tag support
        run: |
          npm install --global npm@11.21.0
          npm --version
      - uses: actions/download-artifact@v8
        with:
          name: rust-release-${{ needs.source.outputs.version }}
          path: rust/dist/npm/release/tarballs
      - name: Record the registry version used for update and rollback
        id: baseline
        working-directory: rust
        run: node scripts/npm-release.mjs rollback-version
      - name: Publish native packages first and the meta package last
        working-directory: rust
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release:publish

  registry-smoke:
    name: Verify registry install/update/rollback (${{ matrix.target }})
    needs: [source, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: win32-x64-msvc
            runner: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install the release npm version
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v8
        with:
          name: rust-release-${{ needs.source.outputs.version }}
          path: rust/dist/npm/release/tarballs
      - name: Test registry packages without explicit native-package installation
        working-directory: rust
        env:
          NPM_ROLLBACK_VERSION: ${{ needs.publish.outputs.baseline }}
        run: npm run release:registry-smoke

  promote:
    name: Promote the verified registry release to latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.dist_tag == 'latest'
    needs: [source, publish, registry-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with OIDC dist-tag support
        run: |
          npm install --global npm@11.21.0
          npm --version
      - uses: actions/download-artifact@v8
        with:
          name: rust-release-${{ needs.source.outputs.version }}
          path: rust/dist/npm/release/tarballs
      - name: Move native latest tags first and the meta latest tag last
        working-directory: rust
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release:promote
