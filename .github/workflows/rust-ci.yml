name: Rust CI

on:
  push:
    branches: [main, dev/rust]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/actions/**"
      - ".gitignore"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/actions/**"
      - ".gitignore"
      - "!**/*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: rust-ci-v2
          workspaces: rust -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check packages independently
        shell: bash
        run: |
          for package in zg-engine zg-daemon-protocol zg-cli zg-host-native zg-testkit zg-transport-mcp zg-daemon zg zg-zvec-fp16; do
            cargo check --locked --package "${package}" --all-targets
          done
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Validate Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: rust-ci-v2
          workspaces: rust -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # The default Windows temp directory is on C:, which is much slower than the D: workspace drive.
      - name: Keep test temp files on the workspace drive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run workspace tests
        run: cargo nextest run --locked --workspace --all-targets --no-fail-fast
      - name: Smoke test the CLI
        shell: bash
        run: ./target/debug/zg${{ runner.os == 'Windows' && '.exe' || '' }} --rg "zvec-grep Rust rewrite" README.md
