name: Rust CI

on:
  push:
    branches: [main, dev/rust]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/actions/**"
      - ".gitignore"
      - "!**/*.md"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
      - ".github/actions/**"
      - ".gitignore"
      - "!**/*.md"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          node --input-type=module --eval
          "const title = process.env.PR_TITLE ?? '';
          const valid = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]+\))?!?: .+/.test(title);
          if (!valid) { console.error('PR title must use Conventional Commits syntax'); process.exit(1); }"
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check packages independently
        shell: bash
        run: |
          for package in zg-engine zg-daemon-protocol zg-cli zg-host-native zg-testkit zg-transport-mcp zg-daemon zg; do
            cargo check --locked --package "${package}" --all-targets
          done
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Validate Cargo metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-
      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets
      - name: Smoke test the CLI
        run: cargo run --locked -p zg -- query --rg "zvec-grep Rust rewrite" README.md
