name: BrowseComp-Plus retrieval contracts

on:
  pull_request:
    paths:
      - benchmarks/browse-comp-plus-retrieval/**
      - .github/workflows/browse-comp-plus-retrieval*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline contracts (no full-corpus measurement)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement benchmarks/browse-comp-plus-retrieval/requirements.txt
      - name: Verify protocol, metrics, process cleanup and partial evidence
        run: |
          node --test benchmarks/zg-retrieval/test/*.test.mjs benchmarks/browse-comp-plus-retrieval/test/*.test.mjs
          python -m unittest discover -s benchmarks/browse-comp-plus-retrieval/test -p 'test_*.py' -v
