name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 4 * * 2"

permissions: {}

jobs:
  dependency-review:
    # Dependency review requires Dependency Graph. Keep it opt-in so
    # repositories without that setting do not fail every pull request.
    if: >-
      github.event_name == 'pull_request' &&
      vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    if: >-
      github.event.repository.visibility == 'public' ||
      vars.ENABLE_GHAS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
