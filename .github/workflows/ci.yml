name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phases:
    name: Phase measurement (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure five fresh processes with identical fixtures
        run: node .github/scripts/measure-ci-phases.mjs
        env:
          PHASE_OUTPUT: ${{ runner.temp }}/phase-results.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phases-${{ matrix.os }}
          path: ${{ runner.temp }}/phase-results.jsonl
          if-no-files-found: error
