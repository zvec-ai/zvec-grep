name: Rust Models CI

on:
  push:
    branches: [main, dev/rust]
    paths:
      - "rust/crates/zg-engine/src/models/**"
      - "rust/crates/zg-engine/src/domain/**"
      - "rust/crates/zg-engine/src/utils/**"
      - "rust/crates/zg-engine/Cargo.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/rust-toolchain.toml"
      - ".github/workflows/rust-models-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "rust/crates/zg-engine/src/models/**"
      - "rust/crates/zg-engine/src/domain/**"
      - "rust/crates/zg-engine/src/utils/**"
      - "rust/crates/zg-engine/Cargo.toml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/rust-toolchain.toml"
      - ".github/workflows/rust-models-ci.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  real-model:
    name: real model (${{ matrix.model.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        model:
          - name: model2vec
            reference: local/potion-code-16m-v2
          - name: transformers
            reference: local/all-minilm-l6-v2
          - name: llama-cpp
            reference: local/embeddinggemma-300m
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-cargo-v1-
      - name: Build the Windows test and expose native runtime libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked -p zg-engine --lib `
            models::tests::real_model_smoke::selected_local_model_downloads_loads_and_embeds `
            --no-run
          $nativeLibraryDirectories = Get-ChildItem -Path target\debug -Filter *.dll -Recurse |
            ForEach-Object { $_.DirectoryName } |
            Sort-Object -Unique
          $nativeLibraryDirectories |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $nativeLibraryDirectories
      - name: Restore the real model cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/zvec-grep-model-cache
          key: >-
            rust-real-model-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.model.name }}-${{ hashFiles('rust/crates/zg-engine/src/models/catalog/**', 'rust/Cargo.lock') }}
          # Node.js and Rust share verified artifact paths. Reusing the Node.js
          # smoke cache avoids a cold network download on the first Rust run;
          # each runtime recreates its own completion marker when necessary.
          restore-keys: |
            rust-real-model-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.model.name }}-
            local-model-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.model.reference }}-${{ hashFiles('src/engine/models/catalog.ts', 'package-lock.json') }}
      - name: Download, load, and run the real model
        env:
          ZVEC_GREP_MODEL_CACHE: ${{ runner.temp }}/zvec-grep-model-cache
          ZVEC_GREP_SMOKE_MODEL: ${{ matrix.model.reference }}
        run: >-
          cargo test --locked -p zg-engine --lib
          models::tests::real_model_smoke::selected_local_model_downloads_loads_and_embeds
          -- --ignored --exact --nocapture
