name: Retrieval-only

run-name: Retrieval-only · ${{ inputs.a10_retry && 'PR 385 A10 retry' || format('{0} embedding', inputs.embedding) }}${{ inputs.local_model && format(' · {0}', inputs.local_model) || '' }} · harness ${{ github.ref_name }} · candidate ${{ inputs.candidate_ref }}

on:
  workflow_call:
    inputs:
      candidate_ref:
        required: true
        type: string
      candidate_repository:
        required: true
        type: string
      embedding:
        default: local
        type: string
      artifact_prefix:
        default: retrieval
        type: string
    secrets:
      QWEN_EMBEDDING_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate ref (main resolves from zvec-ai/zvec-grep; other refs resolve from this fork)
        required: true
        default: main
        type: string
      embedding:
        description: Embedding runtime (local uses each suite's configured model; remote uses Qwen3.7 Text Embedding)
        required: true
        default: local
        type: choice
        options:
          - local
          - remote
      local_model:
        description: Explicit local model for the PR 385 embedding matrix
        required: false
        type: string
      a10_retry:
        description: Retry the outstanding PR 385 local-model suites on the NVIDIA A10 runner
        default: false
        type: boolean

permissions:
  contents: read

env:
  RETRIEVAL_EMBEDDING: ${{ inputs.embedding }}

concurrency:
  group: retrieval-only-${{ github.ref }}-${{ inputs.candidate_ref }}-${{ inputs.embedding }}-${{ inputs.a10_retry && 'a10' || inputs.artifact_prefix || 'retrieval' }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Check benchmark access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      harness-commit: ${{ steps.harness.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - name: Validate the A10 replay
        if: inputs.a10_retry
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          LOCAL_MODEL: ${{ inputs.local_model }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$RETRIEVAL_EMBEDDING" = local
          test -z "$LOCAL_MODEL"
          test "$CANDIDATE_REF" = e2b07a6cd5d11c728839f2182decf7077ae3b1f9
      - name: Validate local model override
        if: inputs.local_model != ''
        env:
          RETRIEVAL_LOCAL_MODEL: ${{ inputs.local_model }}
        run: |
          node --input-type=module -e 'import { embeddingModel } from "./benchmarks/zg-retrieval/core/embedding.mjs"; embeddingModel(null, process.env.RETRIEVAL_EMBEDDING)'
      - name: Check remote embedding configuration
        if: inputs.embedding == 'remote'
        env:
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: |
          test -n "$ZVEC_GREP_API_KEY" || { echo 'QWEN_EMBEDDING_API_KEY secret is missing'; exit 1; }
          test -n "$ZVEC_GREP_ENDPOINT" || { echo 'QWEN_EMBEDDING_ENDPOINT variable is missing'; exit 1; }
      - name: Freeze the selected benchmark harness
        id: harness
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality-contract:
    name: Validate retrieval contracts
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test the five metrics, replay protocol and upstream nDCG oracle
        run: node --test benchmarks/zg-retrieval/test/*.test.mjs

  package-candidate:
    name: build Rust retrieval candidate
    needs: [authorize, quality-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      candidate-commit: ${{ steps.rust-candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - name: Ensure the CUDA packager can set runtime library paths
        if: inputs.a10_retry
        run: |
          if ! command -v patchelf >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends patchelf
          fi
      - name: Build and verify the selected Rust package
        id: rust-candidate
        uses: ./.github/actions/rust-candidate-package
        env:
          LLAMA_CPP_BUILD_MODE: ${{ inputs.a10_retry && 'prebuilt' || 'auto' }}
        with:
          candidate_repository: ${{ inputs.candidate_repository || (inputs.candidate_ref == 'main' && 'zvec-ai/zvec-grep' || github.repository) }}
          candidate_ref: ${{ inputs.candidate_ref }}
          cache_namespace: ${{ inputs.a10_retry && 'retrieval-rust-cuda' || 'retrieval-rust' }}
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ inputs.artifact_prefix || 'retrieval' }}-candidate
          path: ${{ runner.temp }}/rust-package-cache/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  sweqa:
    name: SWE-QA20 (20 questions)
    if: ${{ !inputs.a10_retry }}
    env:
      RETRIEVAL_EMBEDDING: ${{ inputs.embedding }}
      RETRIEVAL_LOCAL_MODEL: ${{ inputs.local_model }}
    needs: [authorize, package-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ inputs.artifact_prefix || 'retrieval' }}-candidate
          path: ${{ runner.temp }}/package
      - name: Verify the candidate package identity
        run: |
          node benchmarks/shared/rust-package-cache.mjs verify \
            --directory "$RUNNER_TEMP/package" \
            --commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - name: Cache the code model
        if: inputs.embedding == 'local'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/model-cache
          key: retrieval-${{ inputs.local_model || 'sweqa-potion-code-16m-v2' }}-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Run all SWE-QA20 repositories through the Rust MCP server
        env:
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: |
          node benchmarks/zg-retrieval/run.mjs \
            --package "$RUNNER_TEMP/package/candidate.tgz" \
            --output "$RUNNER_TEMP/sweqa" \
            --corpus "$RUNNER_TEMP/corpus" \
            --model-cache "$RUNNER_TEMP/model-cache" \
            --candidate-commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - name: Build the SWE-QA20 conclusion report
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          node benchmarks/zg-retrieval/ci-report.mjs \
            --zg "$RUNNER_TEMP/sweqa/report.json" \
            --output "$RUNNER_TEMP/sweqa"
      - name: Publish SWE-QA20 results for this job
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$RUNNER_TEMP/sweqa/summary.md" ]; then
            cat "$RUNNER_TEMP/sweqa/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## SWE-QA20: no report produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve SWE-QA20 conclusion report
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-zg-report
          path: |
            ${{ runner.temp }}/sweqa/report.json
            ${{ runner.temp }}/sweqa/report.md
            ${{ runner.temp }}/sweqa/summary.json
            ${{ runner.temp }}/sweqa/summary.md
            ${{ runner.temp }}/sweqa/scores.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve SWE-QA20 public evidence
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-zg-evidence
          path: |
            ${{ runner.temp }}/sweqa/
            !${{ runner.temp }}/sweqa/consumer/**
            !${{ runner.temp }}/sweqa/**/runtime-home/**
          if-no-files-found: warn
          retention-days: 14

  beir:
    name: BEIR / four datasets (20 queries)
    if: ${{ !inputs.a10_retry }}
    env:
      RETRIEVAL_EMBEDDING: ${{ inputs.embedding }}
      RETRIEVAL_LOCAL_MODEL: ${{ inputs.local_model }}
    needs: [authorize, package-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ inputs.artifact_prefix || 'retrieval' }}-candidate
          path: ${{ runner.temp }}/package
      - name: Verify the candidate package identity
        run: |
          node benchmarks/shared/rust-package-cache.mjs verify \
            --directory "$RUNNER_TEMP/package" \
            --commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/zg-retrieval/expansion/requirements-beir.txt
      - name: Install the pinned BEIR Parquet reader
        run: python -m pip install --requirement benchmarks/zg-retrieval/expansion/requirements-beir.txt
      - name: Cache the multilingual model
        if: inputs.embedding == 'local'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/beir-model-cache
          key: retrieval-${{ inputs.local_model || 'potion-multilingual-128m' }}-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Run BEIR retrieval suite
        env:
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: |
          node benchmarks/zg-retrieval/expansion/run.mjs \
            --suite beir \
            --package "$RUNNER_TEMP/package/candidate.tgz" \
            --output "$RUNNER_TEMP/beir" \
            --model-cache "$RUNNER_TEMP/beir-model-cache" \
            --candidate-commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - name: Publish BEIR results for this job
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$RUNNER_TEMP/beir/report.md" ]; then
            cat "$RUNNER_TEMP/beir/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## BEIR: no report produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve BEIR report
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-beir-report
          path: |
            ${{ runner.temp }}/beir/report.json
            ${{ runner.temp }}/beir/report.md
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve BEIR public evidence
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-beir-evidence
          path: |
            ${{ runner.temp }}/beir/evidence/
            !${{ runner.temp }}/beir/evidence/**/runtime-home/**
          if-no-files-found: warn
          retention-days: 14

  duretrieval:
    name: DuRetrieval / Chinese web search (10 queries)
    if: ${{ !inputs.a10_retry }}
    env:
      RETRIEVAL_EMBEDDING: ${{ inputs.embedding }}
      RETRIEVAL_LOCAL_MODEL: ${{ inputs.local_model }}
    needs: [authorize, package-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ inputs.artifact_prefix || 'retrieval' }}-candidate
          path: ${{ runner.temp }}/package
      - name: Verify the candidate package identity
        run: |
          node benchmarks/shared/rust-package-cache.mjs verify \
            --directory "$RUNNER_TEMP/package" \
            --commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmarks/zg-retrieval/expansion/requirements-duretrieval.txt
      - name: Install the pinned Parquet reader
        run: python -m pip install --requirement benchmarks/zg-retrieval/expansion/requirements-duretrieval.txt
      - name: Cache the multilingual model
        if: inputs.embedding == 'local'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/duretrieval-model-cache
          key: retrieval-${{ inputs.local_model || 'potion-multilingual-128m' }}-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Run DuRetrieval pilot
        env:
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: |
          node benchmarks/zg-retrieval/expansion/run.mjs \
            --suite duretrieval \
            --package "$RUNNER_TEMP/package/candidate.tgz" \
            --output "$RUNNER_TEMP/duretrieval" \
            --model-cache "$RUNNER_TEMP/duretrieval-model-cache" \
            --candidate-commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - name: Publish DuRetrieval results for this job
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$RUNNER_TEMP/duretrieval/report.md" ]; then
            cat "$RUNNER_TEMP/duretrieval/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## DuRetrieval: no report produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve DuRetrieval report
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-duretrieval-report
          path: |
            ${{ runner.temp }}/duretrieval/report.json
            ${{ runner.temp }}/duretrieval/report.md
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve DuRetrieval public evidence
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-duretrieval-evidence
          path: |
            ${{ runner.temp }}/duretrieval/evidence/
            !${{ runner.temp }}/duretrieval/evidence/**/runtime-home/**
          if-no-files-found: warn
          retention-days: 14

  quarry:
    name: Quarry / eight languages (20 queries)
    if: ${{ !inputs.a10_retry }}
    env:
      RETRIEVAL_EMBEDDING: ${{ inputs.embedding }}
      RETRIEVAL_LOCAL_MODEL: ${{ inputs.local_model }}
    needs: [authorize, package-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - uses: actions/download-artifact@v8
        with:
          name: package-${{ inputs.artifact_prefix || 'retrieval' }}-candidate
          path: ${{ runner.temp }}/package
      - name: Verify the candidate package identity
        run: |
          node benchmarks/shared/rust-package-cache.mjs verify \
            --directory "$RUNNER_TEMP/package" \
            --commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - name: Cache the code model
        if: inputs.embedding == 'local'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/quarry-model-cache
          key: retrieval-${{ inputs.local_model || 'quarry-potion-code-16m-v2' }}-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Run Quarry retrieval suite
        env:
          ZVEC_GREP_API_KEY: ${{ secrets.QWEN_EMBEDDING_API_KEY }}
          ZVEC_GREP_ENDPOINT: ${{ vars.QWEN_EMBEDDING_ENDPOINT }}
        run: |
          node benchmarks/zg-retrieval/expansion/run.mjs \
            --suite quarry \
            --package "$RUNNER_TEMP/package/candidate.tgz" \
            --output "$RUNNER_TEMP/quarry" \
            --model-cache "$RUNNER_TEMP/quarry-model-cache" \
            --candidate-commit "${{ needs.package-candidate.outputs.candidate-commit }}"
      - name: Publish Quarry results for this job
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$RUNNER_TEMP/quarry/report.md" ]; then
            cat "$RUNNER_TEMP/quarry/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Quarry: no report produced' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve Quarry report
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-quarry-report
          path: |
            ${{ runner.temp }}/quarry/report.json
            ${{ runner.temp }}/quarry/report.md
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Quarry public evidence
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-quarry-evidence
          path: |
            ${{ runner.temp }}/quarry/evidence/
            !${{ runner.temp }}/quarry/evidence/**/runtime-home/**
          if-no-files-found: warn
          retention-days: 14

  a10-retry:
    name: A10 / ${{ matrix.model }} / ${{ matrix.suite }}
    if: github.event_name == 'workflow_dispatch' && inputs.a10_retry
    needs: [authorize, package-candidate]
    runs-on: gpu-linux-a10
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { model: all-minilm-l6-v2, suite: quarry }
          - { model: gte-modernbert-base, suite: beir }
          - { model: gte-modernbert-base, suite: sweqa }
          - { model: gte-modernbert-base, suite: quarry }
          - { model: gte-modernbert-base, suite: duretrieval }
          - { model: jina-embeddings-v2-base-code, suite: quarry }
          - { model: jina-embeddings-v2-base-code, suite: duretrieval }
          - { model: nomic-embed-text-v1.5, suite: sweqa }
          - { model: nomic-embed-text-v1.5, suite: quarry }
          - { model: nomic-embed-text-v1.5, suite: duretrieval }
    env:
      RETRIEVAL_LOCAL_MODEL: local/${{ matrix.model }}
      RETRIEVAL_LOCAL_DEVICE: cuda
      CANDIDATE_COMMIT: ${{ needs.package-candidate.outputs.candidate-commit }}
      RETRIEVAL_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the NVIDIA A10
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv | tee "$RUNNER_TEMP/gpu.csv"
          grep -Eq '(^|[[:space:]])A10,' "$RUNNER_TEMP/gpu.csv"
      - name: Restore ONNX CUDA runtime libraries
        id: cuda-libraries
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/retrieval-cuda-runtime
          key: retrieval-cuda-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/retrieval-a10-runtime.txt') }}
      - name: Install ONNX CUDA runtime libraries
        if: steps.cuda-libraries.outputs.cache-hit != 'true'
        run: |
          python -m pip install --no-deps --require-hashes \
            --target "$RUNNER_TEMP/retrieval-cuda-runtime" \
            --requirement .github/scripts/retrieval-a10-runtime.txt
      - name: Cache installed CUDA libraries
        if: steps.cuda-libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/retrieval-cuda-runtime
          key: ${{ steps.cuda-libraries.outputs.cache-primary-key }}
      - name: Configure ONNX CUDA library lookup
        run: |
          libraries="$(find "$RUNNER_TEMP/retrieval-cuda-runtime/nvidia" -type d -name lib | sort | paste -sd:)"
          test -n "$libraries"
          echo "LD_LIBRARY_PATH=$libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: package-retrieval-candidate
          path: ${{ runner.temp }}/package
      - name: Verify the candidate and CUDA package variant
        run: |
          node benchmarks/shared/rust-package-cache.mjs verify \
            --directory "$RUNNER_TEMP/package" \
            --commit "$CANDIDATE_COMMIT"
          tar -xOf "$RUNNER_TEMP/package/candidate.tgz" package/package.json |
            node -e 'const assert = require("node:assert/strict"); assert.equal(JSON.parse(require("node:fs").readFileSync(0)).zvecGrep.variant, "cuda")'
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/a10-model-cache
          key: retrieval-a10-${{ matrix.model }}-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Run the frozen Retrieval-only suite with CUDA
        env:
          ORT_LOG: verbose
          RUST_LOG: warn,zg=debug,zg_engine=debug,ort=trace
        shell: bash
        run: |
          common=(
            --package "$RUNNER_TEMP/package/candidate.tgz"
            --output "$RUNNER_TEMP/a10-results"
            --model-cache "$RUNNER_TEMP/a10-model-cache"
            --candidate-commit "$CANDIDATE_COMMIT"
          )
          case "$RETRIEVAL_SUITE" in
            sweqa)
              node benchmarks/zg-retrieval/run.mjs "${common[@]}" --corpus "$RUNNER_TEMP/a10-corpus"
              ;;
            beir|duretrieval)
              python -m pip install --requirement "benchmarks/zg-retrieval/expansion/requirements-$RETRIEVAL_SUITE.txt"
              node benchmarks/zg-retrieval/expansion/run.mjs "${common[@]}" --suite "$RETRIEVAL_SUITE"
              ;;
            quarry)
              node benchmarks/zg-retrieval/expansion/run.mjs "${common[@]}" --suite "$RETRIEVAL_SUITE"
              ;;
          esac
      - name: Publish suite report
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$RUNNER_TEMP/a10-results/report.md" ]; then
            cat "$RUNNER_TEMP/a10-results/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve the report
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: a10-${{ matrix.model }}-${{ matrix.suite }}-report
          path: |
            ${{ runner.temp }}/gpu.csv
            ${{ runner.temp }}/a10-results/report.json
            ${{ runner.temp }}/a10-results/report.md
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
      - name: Preserve per-query and CUDA evidence
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: a10-${{ matrix.model }}-${{ matrix.suite }}-evidence
          path: |
            ${{ runner.temp }}/a10-results/
            !${{ runner.temp }}/a10-results/consumer/**
            !${{ runner.temp }}/a10-results/corpus/**
            !${{ runner.temp }}/a10-results/source/**
            !${{ runner.temp }}/a10-results/**/runtime-home/**
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  results:
    name: Retrieval results
    env:
      RETRIEVAL_EMBEDDING: ${{ inputs.embedding }}
      RETRIEVAL_LOCAL_MODEL: ${{ inputs.local_model }}
    if: ${{ always() && !inputs.a10_retry && needs.authorize.result == 'success' }}
    needs:
      [
        authorize,
        quality-contract,
        package-candidate,
        sweqa,
        beir,
        duretrieval,
        quarry,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.authorize.outputs.harness-commit }}
          persist-credentials: false
      - uses: ./.github/actions/retrieval-authorize
        id: access
      - name: Download ZG report
        if: ${{ always() && steps.access.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-zg-report
          path: ${{ runner.temp }}/results-input/zg
      - name: Download BEIR report
        if: ${{ always() && steps.access.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-beir-report
          path: ${{ runner.temp }}/results-input/beir
      - name: Download DuRetrieval report
        if: ${{ always() && steps.access.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-duretrieval-report
          path: ${{ runner.temp }}/results-input/duretrieval
      - name: Download Quarry report
        if: ${{ always() && steps.access.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-quarry-report
          path: ${{ runner.temp }}/results-input/quarry
      - name: Build the unified results page
        if: ${{ always() && steps.access.outcome == 'success' }}
        env:
          RETRIEVAL_JOB_RESULTS: ${{ toJSON(needs) }}
          RETRIEVAL_HARNESS_COMMIT: ${{ needs.authorize.outputs.harness-commit }}
          RETRIEVAL_CANDIDATE_REF: ${{ inputs.candidate_ref }}
          RETRIEVAL_CANDIDATE_COMMIT: ${{ needs.package-candidate.outputs.candidate-commit }}
        run: |
          node benchmarks/zg-retrieval/expansion/combined.mjs \
            --zg "$RUNNER_TEMP/results-input/zg/report.json" \
            --beir "$RUNNER_TEMP/results-input/beir/report.json" \
            --duretrieval "$RUNNER_TEMP/results-input/duretrieval/report.json" \
            --quarry "$RUNNER_TEMP/results-input/quarry/report.json" \
            --output "$RUNNER_TEMP/retrieval-results"
      - name: Publish the unified results page
        if: ${{ always() && steps.access.outcome == 'success' }}
        run: |
          if [ -f "$RUNNER_TEMP/retrieval-results/summary.md" ]; then
            cat "$RUNNER_TEMP/retrieval-results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Retrieval-only: FAILED' >> "$GITHUB_STEP_SUMMARY"
            echo 'No validated results table was produced. Inspect the failed job; missing results are not zero scores.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve the combined results
        if: ${{ always() && steps.access.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'retrieval' }}-results
          path: |
            ${{ runner.temp }}/retrieval-results/summary.md
            ${{ runner.temp }}/retrieval-results/summary.json
            ${{ runner.temp }}/retrieval-results/reports/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
