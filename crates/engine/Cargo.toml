[package]
name = "zvec-grep-engine"
description = "Core indexing and search engine for zvec-grep."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "zvec_grep_engine"
path = "src/lib.rs"

[features]
default = []
llama-cpp = ["dep:home", "dep:llama_cpp"]
metal = ["llama-cpp", "llama_cpp/metal"]

[dependencies]
blake3 = "1.8"
fs2 = "0.4"
globset = "0.4"
home = { version = "=0.5.11", optional = true }
ignore = "0.4"
llama_cpp = { version = "0.3.2", default-features = false, features = ["compat"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
zvec-rust = "0.5.1"

[lints]
workspace = true
