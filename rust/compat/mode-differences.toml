# Direct and Server call the same ZvecGrep methods. Entries here are the only allowed
# semantic differences and must be exercised by compatibility tests.

[[difference]]
id = "path-lookup-is-local"
operation = "path_lookup"
direct = "look up current file names and literal source in the invoking process"
server = "use the same local lookup without requiring or contacting a daemon"
reason = "file names and exhaustive current text are independent of index availability; truncated local text explicitly reports incomplete coverage"

[[difference]]
id = "managed-rg-is-local"
operation = "lexical_search"
direct = "run in the invoking process"
server = "run in the invoking process; do not route through the daemon"
reason = "compatibility with the current CLI contract"

[[difference]]
id = "indexed-query-refresh-default"
operation = "query"
direct = "off"
server = "background"
reason = "only a resident process can safely own a background refresh"

[[difference]]
id = "indexed-query-change-observation"
operation = "query"
direct = "compare returned sources with indexed snapshots"
server = "also consider observed pending workspace changes and drift found by inspections"
reason = "only the resident server owns watcher evidence; neither mode scans the entire workspace solely to label search freshness"

[[difference]]
id = "resident-resources"
operation = "lifecycle"
direct = "resources live for one command"
server = "one process-level ZvecGrep instance and its private resources are reused across roots"
reason = "lifecycle difference; semantic replies remain equivalent"
