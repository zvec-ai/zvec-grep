# TypeScript/Rust differences are forbidden unless listed here with an owner,
# reason and removal condition.

[[difference]]
id = "cli-managed-rg-files"
owner = "CLI/engine"
reason = "Rust supports explicit metadata-only file discovery with zg --rg --files, native input-path semantics, glob/type/ignore filters, plain paths, NUL delimiters and file-discovery exit codes. TypeScript and the MCP rg tool retain their content-search contracts. Direct, Server and Auto modes all run discovery locally; recursive walks skip internal directories like managed content search. Validation: rg_files integration tests and CLI parsing tests."
removal_condition = "TypeScript gains equivalent CLI file discovery or its compatibility surface is retired."

[[difference]]
id = "cli-positional-words-form-one-query"
owner = "CLI"
reason = "Rust adopts the positional-query behavior proposed in PR #134: nonempty positional arguments form one hybrid query, while repeated --hybrid/--fts/--vector options retain explicit groups. Ambiguous phrase arguments warn on stderr. Direct and Server modes share this parsing; managed --rg keeps pattern/path semantics."
removal_condition = "The TypeScript CLI adopts the same positional-query and warning behavior, or the TypeScript compatibility layer is retired."

[[difference]]
id = "rust-pi-agent-integration"
owner = "CLI/installer"
reason = "Rust adds the pi install/uninstall target for native user-level MCP, stable ownership and active global context. The TypeScript installer does not support this target. Both transports retain shared daemon behavior; native client limitations require manual Remote Embedding authorization. Validation: pi_install and CLI help integration tests."
removal_condition = "The TypeScript installer gains equivalent support or its compatibility surface is retired."

[[difference]]
id = "watcher-same-path-last-event-wins"
owner = "watcher/scanner"
reason = "修复 TypeScript ChangeSet 在 delete 后同路径 recreate 被旧删除事件吞掉的问题；同一路径按事件到达顺序以后到事件为准。"
removal_condition = "TypeScript 兼容层退役，或 TypeScript 实现采用相同语义。"

[[difference]]
id = "filesystem-root-containment"
owner = "watcher/scanner"
reason = "Rust 使用路径组件判断包含关系，修复 TypeScript 对文件系统根目录执行字符串前缀判断时无法识别子路径的问题。"
removal_condition = "TypeScript 兼容层退役，或 TypeScript 实现改用路径组件判断。"

[[difference]]
id = "mcp-observed-file-change-freshness"
owner = "MCP/workspace-runtime"
reason = "Rust 仅在已观察到文件变更、磁盘差异或返回源文件与索引快照不一致时报告 possibly_stale；读取当前索引、恢复检查和后台任务状态本身不作为证据。Node.js 仍把 watcherPending 和非后台检查的排队/运行任务视为 stale。验证：freshness_never_uses_provenance_as_a_status 及 workspace_runtime freshness 回归。"
removal_condition = "Node.js 同样只依据文件变更证据报告 freshness 后移除此差异。"

[[difference]]
id = "engine-content-source-coordinates"
owner = "engine/presentation"
reason = "Rust engine 显式返回 content_range，CLI 与 MCP 直接使用内容坐标。Node.js formatter 根据内容行数猜测实体或片段范围，在带末尾换行且行数相等时可能错标源码行号；Rust 不保留该错误。半开区间行号解释也由 engine 统一提供。"
removal_condition = "Node.js 同样提供明确的内容范围并移除行数猜测后，统一更新对照用例。"

[[difference]]
id = "cli-managed-rg-option-values"
owner = "CLI"
reason = "Rust treats managed-rg option values such as -e --index and -e -- as literal patterns, not management actions or argument separators. This preserves ripgrep semantics rather than reproducing the TypeScript action scanner's option-value bug (PR #196)."
removal_condition = "The TypeScript CLI also skips option values during action and separator scanning, or the TypeScript compatibility layer is retired."

[[difference]]
id = "mcp-indexed-scan-options-explicit-rejection"
owner = "MCP/file-selection"
reason = "Node.js contextFromOpenWorkspaceIndex 不向 searchPlan 传递扫描选项；Rust 对搜索请求中的扫描选项返回 invalid params 并指向 index 工具。Rust index 使用 includeHidden/useDefaultIgnores/ignoreFiles/maxDepth/maxFileSizeBytes/follow；useDefaultIgnores 控制默认与自动发现的忽略规则，显式 ignoreFiles 始终生效且必须存在，maxFileSizeBytes 非空时必须大于零。查询不修改持久扫描配置。验证：search_accepts_ordered_globs_and_engine_formats_and_rejects_scan_options、公用 handler 参数校验及 file_selection 测试。"
removal_condition = "Node.js 为这些 indexed-search 参数提供实际语义后重新对照；不得仅为 schema 相同而忽略参数。"

[[difference]]
id = "mcp-typed-filter-and-index-extensions"
owner = "MCP/engine"
reason = "保留 typed glob、includedFormats/excludedFormats/categories/excludedCategories、enum 符号、索引 name/nestedGit、maxDepth/maxFileSizeBytes 的 null 清除以及额外诊断。它们分别保留顺序混合大小写规则、引擎格式分类、枚举检索、工作区命名、嵌套仓库控制和配置清除能力。Rust fileTypes/excludedFileTypes 仅用于查询；index 与普通索引查询通过 includedFormats/excludedFormats 使用同一文件名格式目录，持久扫描规则保存格式限制和 globs。follow、scan_diagnostics 和 status 保留，status 的 glob_rules 保留完整混合规则顺序。验证：MCP schema/mapping 测试、file_selection 和 job_scheduler 测试。"
removal_condition = "Node.js 提供同等能力或这些扩展不再有客户端时，按字段评估统一；不能删除引擎能力来简化协议。"

[[difference]]
id = "mcp-strict-input-validation"
owner = "MCP/security"
reason = "Rust 对 search/index 未知字段和非法 null 返回 invalid params，而 Node 对未知字段做丢弃；Rust 同时拒绝 root/path 中的父目录组件。显式错误避免拼错过滤参数或误传凭据后得到非预期范围。合法普通参数仍兼容；客户端需删除未知字段并规范化路径。验证：public_globs_types_and_follow_map_without_format_aliases、search_does_not_expose_runtime_credentials、maps_full_rg_without_using_a_shell_and_enforces_root_scope。"
removal_condition = "公共契约明确要求容忍未知字段或父目录路径时，保留范围校验并重新设计兼容适配。"

[[difference]]
id = "mcp-process-local-continuations"
owner = "MCP/authorization"
reason = "新版授权使用不可预测的 opaque requestState 引用有界服务端状态，SHA-256 摘要绑定调用方、工具、参数及目标；十分钟过期、原子单次消费、最多 4096 个待授权请求。客户端不需解析令牌；daemon 重启后需重新请求授权。避免引入锁定 rmcp request-state feature 当前无法解析的 hmac 依赖，也不持久化一次请求的凭据。验证：wire_continuation_binds_arguments_expires_and_redeems_atomically、modern_http_discovery_tools_errors_and_remote_continuation、新旧 stdio 真实远程授权测试。"
removal_condition = "SDK 签名依赖可用且确有跨 daemon 重启续传需求时评估迁移，仍须保留请求/调用方/目标绑定与原子防重放。"

[[difference]]
id = "mcp-legacy-session-capacity-status"
owner = "MCP/HTTP"
reason = "旧会话达到 256 个时拒绝创建；rmcp SessionManager 错误通过 SDK 返回 HTTP 500，Node 返回 503。客户端均应退避并等待旧会话关闭/过期。暂时保留 SDK 错误边界，避免按 SDK 私有错误文案重写 HTTP 响应。验证：bounds_sessions_and_expires_only_idle_work；新协议不占旧会话名额。"
removal_condition = "rmcp 提供 SessionManager 错误到 HTTP 状态的稳定映射后改为 503。"

[[difference]]
id = "mcp-workspace-status-storage-metadata"
owner = "MCP/storage"
reason = "Rust workspace_index.id 使用持久工作区名称而非 Node 的内部标识格式；调用方应将其视为不透明标识。Rust 尚未持久化 embedding 输入截断统计，因此不虚构 truncated_fragments=0，保留现有真实 status 统计。验证：status 序列化和引擎 info 回归；scan_diagnostics 的完整计数独立于有界样本。"
removal_condition = "底层存储支持截断统计或统一工作区标识后补齐字段，并添加真实索引回归。"

[[difference]]
id = "cli-path-lookup-local-admission"
owner = "CLI/current-source"
reason = "路径查找在 direct/server/auto 均先读取本地当前文件，显式 server 不跳过。文本覆盖被结果或候选上限截断时输出不完整警告，保持本地检索，不启动索引或补入无关向量近邻。验证：path_lookup_reports_file_and_text_truncation_without_indexing_in_all_modes、warm_index_path_lookups_return_current_text_or_no_matches_without_vector_neighbors。"
removal_condition = "Node.js 采用相同本地查找边界，或产品明确要求不完整路径文本查找继续使用索引后重新评估。"

[[difference]]
id = "cli-path-lookup-native-selection"
owner = "CLI/file-selection"
reason = "文件命中同级排序保留跨运行确定的原生路径顺序，不依赖系统 locale；保留 Rust 已有混合 glob 输入顺序、引擎格式别名、非 Git 目录中的 ignore 处理，以及重复 ./、目录别名、Windows 扩展路径规范化。输出路径统一为正斜杠。结构预览使用引擎实际提供的元数据字段和明确内容坐标。"
removal_condition = "两端统一文件选择、结构元数据和排序契约后更新对照；不得为复制旧行为而破坏 Rust 已有扫描规则。"
