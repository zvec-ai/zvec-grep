# Based on the normalized zvec-rust 0.7.1 manifest from crates.io.
# See LOCAL_PATCH.md for the limited local changes.

[package]
edition = "2021"
rust-version = "1.70"
name = "zvec-rust"
version = "0.7.1"
build = "build.rs"
links = "zvec_rust"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Safe Rust bindings for the zvec vector database"
readme = "README.md"
keywords = [
    "vector-database",
    "zvec",
    "similarity-search",
    "embeddings",
    "hnsw",
]
categories = [
    "database",
    "api-bindings",
]
license = "Apache-2.0"
repository = "https://github.com/zvec-ai/zvec-rust"

[package.metadata.docs.rs]
features = ["bundled"]

[features]
bundled = ["zvec-rust-sys/bundled"]
default = ["bundled"]

[lib]
name = "zvec_rust"
path = "src/lib.rs"

[dependencies.zvec-rust-sys]
version = "=0.7.1"

[dev-dependencies.tempfile]
version = "3"

[[test]]
name = "scalar_query_test"
path = "tests/scalar_query_test.rs"
