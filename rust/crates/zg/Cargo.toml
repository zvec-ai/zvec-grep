[package]
name = "zg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
cuda = ["zg-engine/cuda", "dep:llama-cpp-sys-2"]

[dependencies]
# Direct dependency exposes DEP_LLAMA_RUNTIME_* (SDK) and DEP_LLAMA_BACKENDS_DIR
# (source) to zg's build script; the engine owns runtime behavior/native features.
llama-cpp-sys-2 = { workspace = true, optional = true }
serde_json.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zg-cli = { path = "../zg-cli" }
zg-daemon = { path = "../zg-daemon" }
zg-daemon-protocol = { path = "../zg-daemon-protocol" }
zg-engine = { path = "../zg-engine" }
zvec-rust.workspace = true

[build-dependencies]
cc = "1.4.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zvec-rust-build.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zg-testkit = { path = "../zg-testkit" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
rustix = { version = "1.1", features = ["fs", "pty", "termios"] }

[lints]
workspace = true
