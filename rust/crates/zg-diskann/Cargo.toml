[package]
name = "zg-diskann"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
node = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
experimental-pq = ["dep:diskann-quantization", "dep:diskann-utils"]

[dependencies]
bytemuck = "1.25"
diskann = "=0.61.0"
diskann-vector = "=0.61.0"
diskann-quantization = { version = "=0.61.0", optional = true }
diskann-utils = { version = "=0.61.0", optional = true }
futures.workspace = true
half = "2.7.1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror.workspace = true
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"], optional = true }
napi-derive = { version = "3", optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
tempfile.workspace = true

# Node-API's generated FFI explicitly allows unsafe code. Keep handwritten
# code denied while permitting that macro boundary; all other rules match the workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
