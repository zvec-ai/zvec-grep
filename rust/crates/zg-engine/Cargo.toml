[package]
name = "zg-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Matching CUDA builds reuse the pinned native SDK; custom CUDA/Vulkan
# configurations require source toolchains. Runtime CPU fallback is unchanged.
cuda = [
    "dep:zg-llama-native",
    "llama-cpp-2/cuda",
    "llama-cpp-2/dynamic-backends",
    "ort/cuda",
]
vulkan = ["llama-cpp-2/vulkan", "ort/webgpu"]

[dependencies]
async-trait.workspace = true
base64 = "0.23.1"
encoding_rs = "0.8.35"
futures-util = "0.3.34"
globset.workspace = true
grep.workspace = true
half = "2.7.1"
hex = "0.4.3"
ignore.workspace = true
hmac-sha256 = "1.1.14"
httpdate = "1.0.3"
llama-cpp-2.workspace = true
# Use the same pinned official runtime in Cargo tests and every native package.
# API selection does not select the download version; build.rs owns that pin.
ort.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rayon = "1.11.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
shutdown_hooks = "0.1.0"
sysinfo.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-go.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
uuid.workspace = true
zg-engine-macros = { path = "macros" }
zg-host-native = { path = "../zg-host-native" }
zg-llama-native = { path = "../zg-llama-native", optional = true }
zg-zvec-fp16 = { path = "../zg-zvec-fp16" }
zvec-rust.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
dunce = "1.0.5"
ort = { workspace = true, features = ["directml"] }

[dev-dependencies]
# Count SQLite VM instructions in graph query performance regression tests.
rusqlite = { version = "0.37", features = ["hooks"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
