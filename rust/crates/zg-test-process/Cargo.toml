[package]
name = "zg-test-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Isolated child commands for native resource tests"

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"

[dev-dependencies]
tempfile.workspace = true

# Keep the pre-exec hook in a test-only dependency; engine code remains safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
