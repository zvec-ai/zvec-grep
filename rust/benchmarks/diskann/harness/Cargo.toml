[package]
name = "zvec-qps-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
zg-diskann = { path = "../../../crates/zg-diskann" }
zg-zvec-fp16 = { path = "../../../crates/zg-zvec-fp16" }
zvec-rust = "=0.8.0"
serde_json = "1"
half = "2.7.1"
libc = "0.2"
diskann-quantization = { version = "=0.61.0", optional = true }
diskann-utils = { version = "=0.61.0", optional = true }
rayon = { version = "1.12", optional = true }

[features]
experimental-pq = ["zg-diskann/experimental-pq", "dep:diskann-quantization", "dep:diskann-utils", "dep:rayon"]

[[bin]]
name = "pq-prepare"
path = "src/bin/pq-prepare.rs"
required-features = ["experimental-pq"]

[[bin]]
name = "pq-bench"
path = "src/bin/pq-bench.rs"
required-features = ["experimental-pq"]

[[bin]]
name = "microsoft-retest"
path = "src/bin/microsoft-retest.rs"
required-features = ["experimental-pq"]

[build-dependencies]
zvec-rust-build = "=0.8.0"

[[bin]]
name = "disjoint-bench"
path = "src/bin/disjoint-bench.rs"
required-features = ["experimental-pq"]

[workspace]

[[bin]]
name = "memory-bench"
path = "src/bin/memory-bench.rs"
required-features = ["experimental-pq"]
